<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Riya ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --accent: #ff2d75;
            --soft-white: #fff;
            --glass: rgba(255, 255, 255, 0.03);
            --neon-glow: 0 0 20px rgba(255, 45, 117, 0.6);
        }

        body {
            background-color: #050102;
            color: var(--soft-white);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Upgraded Floating Heart Design */
        .heart-container {
            position: relative;
            width: 60px;
            height: 60px;
            margin: 0 auto 1.5rem;
            filter: drop-shadow(var(--neon-glow));
            animation: heartbeat 1.2s infinite;
        }

        .heart-design {
            background-color: var(--accent);
            display: inline-block;
            height: 30px;
            margin: 0 10px;
            position: relative;
            top: 0;
            transform: rotate(-45deg);
            width: 30px;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.3);
        }

        .heart-design:before, .heart-design:after {
            content: "";
            background-color: var(--accent);
            border-radius: 50%;
            height: 30px;
            position: absolute;
            width: 30px;
        }

        .heart-design:before { top: -15px; left: 0; }
        .heart-design:after { left: 15px; top: 0; }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.25); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }

        /* Glass Card with Animated Border */
        .main-card {
            background: var(--glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 1.5rem;
            border-radius: 40px;
            text-align: center;
            width: 85%;
            max-width: 400px;
            position: relative;
            z-index: 10;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .main-card::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, transparent, var(--accent), transparent);
            border-radius: 40px;
            z-index: -1;
            animation: borderRotate 4s linear infinite;
        }

        @keyframes borderRotate {
            0% { filter: hue-rotate(0deg); opacity: 0.5; }
            100% { filter: hue-rotate(360deg); opacity: 0.5; }
        }

        #typewriter {
            font-size: 1.1rem;
            min-height: 3rem;
            color: #ccc;
            letter-spacing: 1px;
        }

        #birthday-wish {
            display: none;
            animation: revealUp 1.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        @keyframes revealUp {
            from { opacity: 0; transform: translateY(30px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        h1 {
            font-size: 2.8rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .name-highlight {
            font-size: 4rem;
            display: block;
            margin: 10px 0;
            font-weight: 800;
            background: linear-gradient(to bottom, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(255, 45, 117, 0.3);
        }

        .love-note {
            margin-top: 20px;
            font-size: 0.95rem;
            line-height: 1.8;
            color: #ddd;
        }

        /* Background Shine */
        .bg-shine {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(255, 45, 117, 0.15) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="bg-shine"></div>

    <div class="main-card">
        <div class="heart-container">
            <div class="heart-design"></div>
        </div>
        
        <div id="typewriter"></div>
        
        <div id="birthday-wish">
            <h1>Happy Birthday</h1>
            <span class="name-highlight">Riya</span>
            <div class="love-note">
                Today is the most beautiful day because it's yours. 
                You are my favorite person, my greatest joy, and my whole heart. 
                I love you more than words could ever show. ✨
            </div>
        </div>
    </div>

    <script>
        const textElement = document.getElementById('typewriter');
        const messages = [
            "Syncing with the stars...",
            "Preparing your surprise...",
            "Loading something special...",
            "Almost there, Riya..."
        ];
        
        let msgIndex = 0;

        function typeMessage(text, callback) {
            let i = 0;
            textElement.innerHTML = '';
            const timer = setInterval(() => {
                if (i < text.length) {
                    textElement.append(text.charAt(i));
                    i++;
                } else {
                    clearInterval(timer);
                    setTimeout(callback, 800);
                }
            }, 60);
        }

        function sequence() {
            if (msgIndex < messages.length) {
                typeMessage(messages[msgIndex], () => {
                    msgIndex++;
                    sequence();
                });
            } else {
                textElement.style.display = 'none';
                const wish = document.getElementById('birthday-wish');
                wish.style.display = 'block';
                
                // High-End Burst Confetti
                const end = Date.now() + (4 * 1000);
                const colors = ['#ff2d75', '#ffffff', '#ff85a1'];

                (function frame() {
                    confetti({
                        particleCount: 2,
                        angle: 60,
                        spread: 55,
                        origin: { x: 0, y: 0.8 },
                        colors: colors
                    });
                    confetti({
                        particleCount: 2,
                        angle: 120,
                        spread: 55,
                        origin: { x: 1, y: 0.8 },
                        colors: colors
                    });

                    if (Date.now() < end) {
                        requestAnimationFrame(frame);
                    }
                }());
            }
        }

        window.onload = sequence;
    </script>
</body>
</html>
